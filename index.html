<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo2.png" />
    <link rel="shortcut icon" href="/logo2.png" />
    <link rel="apple-touch-icon" href="/logo2.png" />
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <title>Alpha stories studio | Premier Photography & Cinematic Visuals</title>
    <!-- GSAP & MotionPathPlugin for Cinematic Animations -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/MotionPathPlugin.min.js"></script>
    <!-- Geo Meta Tags: firmly plants domain authority in Chengalpattu -->
    <meta name="geo.region" content="IN-TN" />
    <meta name="geo.placename" content="Chengalpattu, Tamil Nadu" />
    <meta name="geo.position" content="12.6939;79.9757" />
    <meta name="ICBM" content="12.6939, 79.9757" />

    <!-- Structured Data (JSON-LD): PhotographyStudio + TNWebz Knowledge Graph Link -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "PhotographyStudio",
      "name": "Alpha Stories Studio",
      "description": "A premium wedding photography studio based in Chengalpattu, capturing timeless moments with cinematic artistry.",
      "url": "https://alphastories.tnwebz.com",
      "telephone": "+91-9629238744",
      "email": "alphastoriesstudio@gmail.com",
      "founder": {
        "@type": "Person",
        "name": "Alwin.E"
      },
      "location": {
        "@type": "Place",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "NO: 45/1108/D Thimmavaram, Kanchipuram high road",
          "addressLocality": "Chengalpattu",
          "addressRegion": "TN",
          "postalCode": "603001",
          "addressCountry": "IN"
        },
        "description": "Near VAO office Thimmavaram",
        "geo": {
          "@type": "GeoCoordinates",
          "latitude": "12.6939",
          "longitude": "79.9757"
        }
      },
      "sameAs": [
        "https://www.instagram.com/stories_by_alpha/"
      ],
      "creator": {
        "@type": "WebDesignCompany",
        "name": "TNWebz",
        "url": "https://tnwebz.com",
        "description": "Top Website Developers and Website Designers and App Designers in Chengalpattu, Tamil Nadu",
        "location": {
          "@type": "Place",
          "address": {
            "@type": "PostalAddress",
            "addressLocality": "Chengalpattu",
            "addressRegion": "TN",
            "addressCountry": "IN"
          }
        }
      }
    }
    </script>

    <!-- Eliminate 0.2s homepage flash before intro loader mounts -->
    <script>
      (function() {
        try {
          var seen = sessionStorage.getItem('alpha-stories-intro-seen-v3');
          var searchParams = new URLSearchParams(window.location.search);
          var force = searchParams.get('intro') === 'true' || window.location.hash === '#intro';
          if (!seen || force) {
            document.documentElement.classList.add('intro-active');
          }
        } catch(e) {}
      })();
    </script>
    <style>
      html.intro-active body {
        overflow: hidden !important;
        background-color: #530000 !important;
      }
      html.intro-active #root > *:not([aria-hidden="true"]) {
        visibility: hidden !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
